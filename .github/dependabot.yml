version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: maven
    directory: /app
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
    commit-message:
      prefix: "build"
