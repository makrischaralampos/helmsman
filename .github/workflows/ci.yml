name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly rebuild so base-image fixes are picked up, re-scanned and re-signed
  workflow_dispatch:

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
  KYVERNO_CHART_VERSION: "3.9.2"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Unit tests
        working-directory: app
        run: mvn -B verify

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint chart
        run: helm lint charts/helmsman

      - name: Scan chart manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: charts/helmsman
          trivyignores: .trivyignore.config
          exit-code: "1"

  build:
    name: Build, scan, sign
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push image
      id-token: write # keyless signing (OIDC)
      attestations: write # SLSA provenance
      security-events: write # upload SARIF
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Build (push on main only)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image reference
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "value=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy scan (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.value }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.value }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---- Everything below runs only on main, after the gate has passed ----

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless, by digest)
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.ref.outputs.value }}
        run: cosign sign --yes "$REF"

      - name: Generate SBOM (Syft, SPDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.value }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM as signed attestation
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.ref.outputs.value }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: SLSA build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Verify and deploy to kind
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify signature and SBOM attestation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | cosign login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          REF="${IMAGE}@${DIGEST}"
          cosign verify "$REF" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "signature OK"
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "SBOM attestation OK"

      - name: Verify SLSA provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$REPO"

      - name: Negative control (an image we did not sign must be rejected)
        run: |
          if cosign verify gcr.io/distroless/static:nonroot \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null 2>&1; then
            echo "verification accepted a foreign image, the gate is broken" >&2
            exit 1
          fi
          echo "foreign image correctly rejected"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: helmsman
          config: deploy/kind-config.yaml

      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno \
            --namespace kyverno --create-namespace \
            --version "$KYVERNO_CHART_VERSION" \
            --set admissionController.replicas=1 \
            --set backgroundController.enabled=false \
            --set cleanupController.enabled=false \
            --set reportsController.enabled=false \
            --wait --timeout 300s

      - name: Enforce signed images at admission
        run: |
          kubectl apply -f deploy/namespace.yaml
          kubectl apply -f policy/verify-signed-images.yaml

      - name: Assert admission rejects an unsigned image
        run: |
          # Retries double as a wait for the policy to become active.
          for i in $(seq 1 30); do
            if OUT=$(kubectl apply -f policy/tests/unsigned-pod.yaml 2>&1); then
              echo "policy not active yet, retrying"
              kubectl -n helmsman delete pod unsigned-probe --ignore-not-found
              sleep 2
            elif echo "$OUT" | grep -qF "must be signed by the Helmsman CI workflow"; then
              echo "unsigned image rejected by the admission policy"
              exit 0
            else
              echo "$OUT"
              sleep 2
            fi
          done
          echo "admission policy never rejected the unsigned image" >&2
          exit 1

      - name: Deploy with Helm (signed image, admitted by policy)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n helmsman create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="${GITHUB_TOKEN}"
          helm upgrade --install helmsman charts/helmsman \
            --namespace helmsman \
            --set image.repository="${IMAGE}" \
            --set image.digest="${DIGEST}" \
            --set "imagePullSecrets[0].name=ghcr-pull" \
            --atomic --wait --timeout 180s

      - name: Smoke test
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: ./scripts/smoke-test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n helmsman get all,events || true
          kubectl -n helmsman describe pods || true
          kubectl -n helmsman logs -l app.kubernetes.io/name=helmsman --tail=100 || true
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=100 || true

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed and verified"
            echo ""
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Signature, SBOM attestation and SLSA provenance verified before deploy"
            echo "- Cluster admission policy rejected an unsigned image, then admitted the signed one"
            echo "- Smoke test passed on kind"
          } >> "$GITHUB_STEP_SUMMARY"
