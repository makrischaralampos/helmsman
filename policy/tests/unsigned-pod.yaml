apiVersion: v1
kind: Pod
metadata:
  name: unsigned-probe
  namespace: helmsman
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: gcr.io/distroless/static:nonroot
      command: ["/nonexistent"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
