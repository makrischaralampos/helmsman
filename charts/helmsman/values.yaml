replicaCount: 2

image:
  repository: ghcr.io/makrischaralampos/helmsman
  # CI deploys by immutable digest (sha256:...). Tag is only a local-dev fallback.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

imagePullSecrets: []
